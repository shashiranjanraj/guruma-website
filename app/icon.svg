<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA84D" />
      <stop offset="65%" stop-color="#E8821A" />
      <stop offset="100%" stop-color="#B25500" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Circular background representing the spiritual sun -->
  <circle cx="24" cy="24" r="22" fill="url(#sunburst)" stroke="#C9982A" stroke-width="1.5" />
  <!-- Center OM Glyph -->
  <text 
    x="24" 
    y="31.5" 
    font-family="'Cinzel Decorative', 'Cinzel', 'Times New Roman', serif" 
    font-size="25" 
    fill="#FFFFFF" 
    font-weight="bold" 
    text-anchor="middle"
    filter="url(#glow)"
  >ॐ</text>
</svg>
